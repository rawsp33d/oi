name: ci

on:
  push:
    branches: [ "main" ]
    paths:
      - "**.rs"
      - "**.oi"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "**.rs"
      - "**.oi"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    # TODO: doctests
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - uses: extractions/setup-just@v4

    - name: ci
      run: just ci
